name: Keep Database Awake

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -f -s https://contexthub-ai.vercel.app/api/health || echo "Ping failed, but workflow finished."
